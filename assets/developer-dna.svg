    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.34s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">Python</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:58.2%;background:#6366F1;animation-delay:0.64s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.42s both;">
      <div class="tca" style="background:#38BDF8"></div>
      <span class="tcn">Docker</span>
      <span class="tcl" style="color:#38BDF8">Intermediate</span>
