    </div>
    <div class="row" style="animation: slideRow 0.5s ease-out 0.45s both;">
      <span class="rl">Large</span>
      <div class="bt"><div class="bar" style="width:0.0%;background:#FB7185;animation-delay:0.8s"></div></div>
      <span class="rv">0%</span>
      <span class="rm">0 repos</span>
    </div>
        </div>
        <div class="sc">
          <h2>Profile</h2>
          <div class="grid2">
    <div class="ss" style="animation: slideUp 0.5s ease-out 0.15s both">
