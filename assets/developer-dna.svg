          <div class="tg">
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.1s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">Django</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:31.0%;background:#6366F1;animation-delay:0.4s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.18s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">PostgreSQL</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:31.0%;background:#6366F1;animation-delay:0.48s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.26s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">React</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
