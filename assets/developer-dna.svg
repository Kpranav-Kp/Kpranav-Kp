    </div></div>
        </div>
        <div class="sc">
          <h2>Project Complexity</h2>
          
    <div class="row" style="animation: slideRow 0.5s ease-out 0.15s both;">
      <span class="rl">Small</span>
      <div class="bt"><div class="bar" style="width:40.0%;background:#6366F1;animation-delay:0.5s"></div></div>
      <span class="rv">40%</span>
      <span class="rm">4 repos</span>
    </div>
    <div class="row" style="animation: slideRow 0.5s ease-out 0.3s both;">
      <span class="rl">Medium</span>
      <div class="bt"><div class="bar" style="width:60.0%;background:#FBBF24;animation-delay:0.65s"></div></div>
      <span class="rv">60%</span>
