<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1000" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="card">
      <style>
        :root {
          --bg1: #0B1220; --bg2: #0F1B2D;
          --surface: rgba(255,255,255,0.03);
          --border: rgba(255,255,255,0.07);
          --bl: rgba(255,255,255,0.05);
          --text: #F1F5F9; --muted: #7485A0;
          --bar-bg: rgba(255,255,255,0.06);
          --accent: #6366F1;
          --green: #34D399; --rose: #F43F5E; --sky: #0EA5E9;
          --shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 8px 32px rgba(0,0,0,0.55);
        }
        @media (prefers-color-scheme: light) {
          :root {
            --bg1: #FFFFFF; --bg2: #F3F5F9;
            --surface: rgba(17,24,39,0.02);
            --border: rgba(17,24,39,0.07);
            --bl: rgba(17,24,39,0.05);
            --text: #0F172A; --muted: #64748B;
            --bar-bg: rgba(17,24,39,0.05);
            --shadow: 0 0 0 1px rgba(17,24,39,0.03), 0 8px 32px rgba(15,23,42,0.08);
          }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .card {
          font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          background: linear-gradient(160deg, var(--bg1), var(--bg2));
          border: 1px solid var(--border);
          border-radius: 20px; padding: 28px;
          box-shadow: var(--shadow);
          width: 100%; min-height: 100%; color: var(--text);
          position: relative;
          animation: cardGlow 5s ease-in-out infinite;
        }
        .card::after {
          content: "";
          position: absolute; inset: -2px; border-radius: 22px;
          background: conic-gradient(from 0deg, var(--accent), var(--sky), var(--green), var(--rose), var(--accent));
          z-index: -1;
          opacity: 0.18;
          animation: ringPulse 5s ease-in-out infinite;
        }
        h1 {
          font-size: 20px; font-weight: 700; text-align: center; letter-spacing: -0.3px;
          margin-bottom: 16px; color: var(--text);
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .sc {
          background: var(--surface); border: 1px solid var(--bl); border-radius: 14px; padding: 16px;
          animation: slideUp 0.5s ease-out both;
        }
        .sc:nth-child(1) { animation-delay: 0.05s; }
        .sc:nth-child(2) { animation-delay: 0.1s; }
        .sc:nth-child(3) { animation-delay: 0.15s; }
        .sf { grid-column: span 2; }
        h2 { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }
        .row { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; min-height: 28px; }
        .rl { width: 72px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
        .bt { flex: 1; height: 6px; background: var(--bar-bg); border-radius: 3px; overflow: hidden; }
        .bar { height: 100%; border-radius: 3px; animation: grow 0.9s cubic-bezier(0.16, 1, 0.3, 1) both; }
        .rv { width: 34px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; text-align: right; }
        .rm { font-size: 10px; color: var(--muted); flex-shrink: 0; width: 48px; text-align: right; }
        .tg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .tc {
          background: var(--bar-bg); border: 1px solid var(--bl); border-radius: 10px; padding: 14px 8px 10px;
          display: flex; flex-direction: column; align-items: center; gap: 3px; position: relative; overflow: hidden;
        }
        .tca { position: absolute; top: 0; left: 0; right: 0; height: 2px; }
        .tcn { font-size: 12px; font-weight: 600; margin-top: 2px; }
        .tcl { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
        .tcb { width: 100%; height: 3px; background: var(--bar-bg); border-radius: 2px; overflow: hidden; margin-top: 3px; }
        .grid2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ss {
          display: flex; flex-direction: column; gap: 2px; padding: 10px 12px;
          border: 1px solid var(--bl); border-radius: 10px; background: var(--bar-bg);
        }
        .sl { font-size: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
        .sv { font-size: 20px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.15; }
        .su { font-size: 9px; font-weight: 600; color: var(--muted); margin-left: 2px; }
        .sd { font-size: 9px; font-weight: 500; color: var(--muted); margin-top: 1px; }
        .habits { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
        .hb { font-size: 9px; font-weight: 600; padding: 3px 10px; border: 1px solid; border-radius: 999px; }
        .legend { font-size: 9px; font-weight: 500; color: var(--muted); margin: 6px 0 2px; }
        .ml { display: flex; justify-content: space-between; margin-top: 4px; }
        .am { font-size: 9px; font-weight: 600; color: var(--muted); width: 8.33%; text-align: center; }
        .bars { display: flex; align-items: flex-end; gap: 6px; height: 96px; }
        .ab { flex: 1; height: 100%; background: var(--bar-bg); border-radius: 4px 4px 0 0; overflow: hidden; display: flex; align-items: flex-end; }
        .afill { width: 100%; background: linear-gradient(180deg, var(--sky), var(--accent)); border-radius: 4px 4px 0 0; transition: height 0.3s; }
        .citywrap { border: 1px dashed var(--bl); border-radius: 10px; padding: 10px; text-align: center; }
        .note { font-size: 11px; color: var(--muted); font-weight: 600; }
        .city { display: block; width: 100%; }
        .footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--bl); font-size: 10px; color: var(--muted); animation: fadeIn 0.6s ease-out 0.6s both; }
        @keyframes grow { from { width: 0%; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideRow { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes ringPulse { 0%, 100% { opacity: 0.12; } 50% { opacity: 0.28; } }
        @keyframes cardGlow {
          0%, 100% { box-shadow: 0 0 18px 0 rgba(99,102,241,0.10), var(--shadow); }
          50% { box-shadow: 0 0 30px 2px rgba(14,165,233,0.18), var(--shadow); }
        }
        .sv { color: var(--text); }
        .city polygon { will-change: opacity; }
        .city polygon:nth-of-type(3n) { filter: brightness(1.05); }
        @media (max-width: 500px) {
          .grid { grid-template-columns: 1fr; }
          .sf { grid-column: span 1; }
          .tg { grid-template-columns: repeat(2, 1fr); }
          .grid2 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) {
          * { animation: none !important; box-shadow: none !important; }
          .card::after { opacity: 0.15; }
        }
      </style>
      <h1>Profile Analytics</h1>
      <div class="grid">
        <div class="sc sf">
          <h2>Core Technologies</h2>
          <div class="tg">
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.1s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">React</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:31.0%;background:#6366F1;animation-delay:0.4s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.18s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">PostgreSQL</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:31.0%;background:#6366F1;animation-delay:0.48s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.26s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">Django</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:31.0%;background:#6366F1;animation-delay:0.56s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.34s both;">
      <div class="tca" style="background:#6366F1"></div>
      <span class="tcn">Python</span>
      <span class="tcl" style="color:#6366F1">Advanced</span>
      <div class="tcb"><div class="bar" style="width:58.4%;background:#6366F1;animation-delay:0.64s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.42s both;">
      <div class="tca" style="background:#38BDF8"></div>
      <span class="tcn">Docker</span>
      <span class="tcl" style="color:#38BDF8">Intermediate</span>
      <div class="tcb"><div class="bar" style="width:24.0%;background:#38BDF8;animation-delay:0.72s"></div></div>
    </div>
    <div class="tc" style="animation: fadeIn 0.5s ease-out 0.5s both;">
      <div class="tca" style="background:#38BDF8"></div>
      <span class="tcn">Redis</span>
      <span class="tcl" style="color:#38BDF8">Intermediate</span>
      <div class="tcb"><div class="bar" style="width:23.0%;background:#38BDF8;animation-delay:0.8s"></div></div>
    </div></div>
        </div>
        <div class="sc">
          <h2>Project Complexity</h2>
          
        <div class="row" style="animation: slideRow 0.5s ease-out 0.15s both;">
          <span class="rl">Small</span>
          <div class="bt"><div class="bar" style="width:40.0%;background:#6366F1;animation-delay:0.5s"></div></div>
          <span class="rv">40%</span>
          <span class="rm">4 repos</span>
        </div>
        <div class="row" style="animation: slideRow 0.5s ease-out 0.3s both;">
          <span class="rl">Medium</span>
          <div class="bt"><div class="bar" style="width:60.0%;background:#FBBF24;animation-delay:0.65s"></div></div>
          <span class="rv">60%</span>
          <span class="rm">6 repos</span>
        </div>
        <div class="row" style="animation: slideRow 0.5s ease-out 0.45s both;">
          <span class="rl">Large</span>
          <div class="bt"><div class="bar" style="width:0.0%;background:#FB7185;animation-delay:0.8s"></div></div>
          <span class="rv">0%</span>
          <span class="rm">0 repos</span>
        </div>
        </div>
        <div class="sc">
          <h2>Profile</h2>
          <div class="grid2">
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.15s both">
          <span class="sl">Current streak</span>
          <span class="sv" style="color:#34D399">2<span class="su">days</span></span>
          
        </div>
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.21s both">
          <span class="sl">Longest streak</span>
          <span class="sv" style="color:#6366F1">9<span class="su">days</span></span>
          <span class="sd">Feb 20 – 28, 2026</span>
        </div>
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.27s both">
          <span class="sl">Lines added</span>
          <span class="sv" style="color:#34D399">229.2k</span>
          <span class="sd">~22.9k/repo</span>
        </div>
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.33s both">
          <span class="sl">Lines deleted</span>
          <span class="sv" style="color:#F43F5E">103.1k</span>
          <span class="sd">~10.3k/repo</span>
        </div>
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.39s both">
          <span class="sl">Commits / week</span>
          <span class="sv" style="color:#6366F1">7.2</span>
          <span class="sd">303 lifetime</span>
        </div>
        <div class="ss" style="animation: slideUp 0.5s ease-out 0.45s both">
          <span class="sl">Peak hours</span>
          <span class="sv" style="color:#0EA5E9">11 PM</span>
          <span class="sd">Sunday</span>
        </div></div>
          <div class="habits"><span class="hb" style="color:#A78BFA;border-color:#A78BFA55;background:#A78BFA11">Long streaks</span><span class="hb" style="color:#FB7185;border-color:#FB718555;background:#FB718511">Night coder</span><span class="hb" style="color:#94A3B8;border-color:#94A3B855;background:#94A3B811">Weekend warrior</span></div>
        </div>
        <div class="sc sf">
          <h2>Commit Activity · Last 12 Months</h2>
          <div class="bars"><div class="ab" title="Sep: 2 commits"><div class="afill" style="height:4%"></div></div><div class="ab" title="Oct: 39 commits"><div class="afill" style="height:62%"></div></div><div class="ab" title="Nov: 13 commits"><div class="afill" style="height:21%"></div></div><div class="ab" title="Dec: 19 commits"><div class="afill" style="height:30%"></div></div><div class="ab" title="Jan: 5 commits"><div class="afill" style="height:8%"></div></div><div class="ab" title="Feb: 20 commits"><div class="afill" style="height:32%"></div></div><div class="ab" title="Mar: 22 commits"><div class="afill" style="height:35%"></div></div><div class="ab" title="Apr: 63 commits"><div class="afill" style="height:100%"></div></div><div class="ab" title="May: 17 commits"><div class="afill" style="height:27%"></div></div><div class="ab" title="Jun: 14 commits"><div class="afill" style="height:22%"></div></div><div class="ab" title="Jul: 54 commits"><div class="afill" style="height:86%"></div></div><div class="ab" title="Aug: 11 commits"><div class="afill" style="height:17%"></div></div></div><div class="ml"><span class="am">Sep</span><span class="am">Oct</span><span class="am">Nov</span><span class="am">Dec</span><span class="am">Jan</span><span class="am">Feb</span><span class="am">Mar</span><span class="am">Apr</span><span class="am">May</span><span class="am">Jun</span><span class="am">Jul</span><span class="am">Aug</span></div>
          <div class="legend">cube height = commits / month</div>
        </div>
      </div>
      <div style="height:20px"></div>
      <div class="footer">
        <span>Updated Aug 2026</span>
        <span>GitHub Actions · profile-analytics</span>
      </div>
    </div>
  </foreignObject>
</svg>