<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="100%" height="100%">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        :root {
          --bg1: #101623; --bg2: #0B1120;
          --border: rgba(255,255,255,0.09);
          --bl: rgba(255,255,255,0.05);
          --text: #F1F5F9; --muted: #94A3B8;
          --green: #34D399; --indigo: #6366F1; --sky: #38BDF8;
          --shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 6px 26px rgba(0,0,0,0.5);
        }
        @media (prefers-color-scheme: light) {
          :root {
            --bg1: #FFFFFF; --bg2: #F3F5F9;
            --border: rgba(15,23,42,0.09);
            --bl: rgba(15,23,42,0.05);
            --text: #0F172A; --muted: #64748B;
            --shadow: 0 0 0 1px rgba(15,23,42,0.03), 0 12px 26px rgba(15,23,42,0.08);
          }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
          background: linear-gradient(155deg, var(--bg1), var(--bg2));
          border: 1px solid var(--border);
          border-radius: 18px; padding: 22px 26px;
          width: 100%; min-height: 100%; color: var(--text);
          box-shadow: var(--shadow);
          display: flex; flex-direction: column; justify-content: center; gap: 4px;
        }
        .row { display: flex; align-items: center; gap: 9px; }
        .dot {
          width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
          background: var(--green);
          animation: blink 2s ease-in-out infinite;
        }
        .name {
          font-size: 24px; font-weight: 800; letter-spacing: -0.6px;
          background: linear-gradient(90deg, var(--sky), var(--indigo), var(--sky));
          background-size: 300% 100%;
          -webkit-background-clip: text; background-clip: text;
          -webkit-text-fill-color: transparent; color: transparent;
          animation: sheen 6s ease-in-out infinite;
        }
        .tag {
          font-size: 13px; font-weight: 600; letter-spacing: 0.4px;
          color: var(--muted);
        }
        .roles { font-size: 13px; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 7px; }
        .role { color: var(--text); font-weight: 600; }
        .sep { opacity: 0.35; }
        .bar { display: flex; align-items: flex-end; gap: 5px; margin-top: 10px; height: 22px; }
        .st { width: 8px; border-radius: 2px; background: linear-gradient(180deg, var(--indigo), var(--sky)); animation: bounce 1.6s ease-in-out infinite; }
        .st:nth-child(1) { height: 45%; animation-delay: 0s; }
        .st:nth-child(2) { height: 90%; animation-delay: 0.1s; }
        .st:nth-child(3) { height: 60%; animation-delay: 0.2s; }
        .st:nth-child(4) { height: 75%; animation-delay: 0.3s; }
        .st:nth-child(5) { height: 35%; animation-delay: 0.4s; }
        @keyframes blink { 0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(52,211,153,0.7); } 50% { opacity: 0.35; box-shadow: none; } }
        @keyframes sheen { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes bounce { 0%, 100% { transform: scaleY(0.55); transform-origin: bottom; } 50% { transform: scaleY(1); transform-origin: bottom; } }
        @media (prefers-reduced-motion: reduce) {
          .dot, .name, .st { animation: none !important; }
        }
      </style>
      <div class="row">
        <span class="dot"></span>
        <span class="name">Kpranav-Kp</span>
      </div>
      <div class="roles">
        <span>Full Stack Engineer</span><span class="sep">·</span>
        <span class="role">AI / ML</span><span class="sep">·</span>
        <span>Backend Systems</span>
      </div>
      <div class="bar">
        <span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span><span class="st"></span>
      </div>
    </div>
  </foreignObject>
</svg>